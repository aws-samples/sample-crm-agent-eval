# SPDX-License-Identifier: MIT
#
# Versioned token price table. Cost is computed from recorded token counts against this table,
# never estimated or read from a live pricing API at measurement time.
#
# Rates are the global-route per-1M-token prices for the models this system uses. A model's optional
# `long_context` block replaces its standard rates for a whole request (every token class, output
# included) whose prompt size (input + cache read + cache write) exceeds `above_prompt_tokens`; a
# request exactly at the threshold is standard. Every rate, standard or long-context, is multiplied by
# the `routes` multiplier of the route its inference profile resolves to. While
# `provisional: false`, absolute currency figures may appear in published artifacts;
# scripts/check_cost_withheld.sh fails the build if `provisional` is `true` and a figure appears
# in results/ or README.md.
#
# These are third-party Marketplace models whose charges appear in Cost Explorer under the provider
# rather than under Bedrock. Rates are transcribed from the sources named in `sourced_from`;
# the refresh procedure is documented in docs/eval-methodology.md.
#
# Cache-write TTL: the Anthropic adapter sets no `cache_control` `ttl`, so the 5-minute Anthropic
# cache-write rate is priced here. The OpenAI models publish only a 30-minute cache-write figure,
# which is priced for them.

schema_version: 2
price_table_version: "1.3.0"
provisional: false
currency: USD
unit: per_1m_tokens

# Route multipliers applied to every rate. `global.` profiles are the global route; the geographic
# prefixes recognised by src/crm/inference_route.py are the geo route.
routes:
  global:
    multiplier: 1.0
  geo:
    multiplier: 1.10

sourced_from: >-
  Global-route on-demand Standard rates, short context. Opus 5.5, Sonnet 5.5, Haiku 5.5 and GPT-6
  Astra from the live AWS Price List: `aws pricing get-products --profile default --region
  us-east-1 --service-code AmazonBedrockFoundationModels`, read 2026-10-10T04:28:30Z, servicename
  "<model> (Amazon Bedrock Edition)", regionCode us-east-1, usagetypes
  `USE1-MP:USE1_*_global_standard-Units` (5m cache write for Anthropic, 30m for GPT-6 Astra). That
  read carries the Sonnet 5.5 cache-read cut effective 2026-10-07 (0.20 to 0.10). GPT-6.1 Sol and
  GPT-6 Luna are absent from the us-east-1 Price List, so their rates come from the AWS Bedrock model
  cards (model-card-openai-gpt-6-1-sol.html, model-card-openai-gpt-6-luna.html; Global CRIS, short
  context), read 2026-10-09. GPT-6.1 Terra is also absent from it; its rates come from its AWS
  Bedrock model card (model-card-openai-gpt-6-1-terra.html; Global CRIS, short context), read
  2026-10-27. The openai tier defaults are Sol, Terra and Luna; Astra stays priced as a
  selectable non-default.
  Long-context rates (Haiku 5.5 above 100,000 prompt tokens; GPT-6.1 Sol, GPT-6.1 Terra, GPT-6
  Luna and GPT-6 Astra above 272,000) and the geo route multiplier (1.10, Geo/In-region cross-Region
  inference) from the AWS Bedrock model cards (model-card-openai-gpt-6-1-sol.html,
  model-card-openai-gpt-6-1-terra.html, model-card-openai-gpt-6-luna.html, and the GPT-6 Astra and
  Claude Haiku, Sonnet and Opus 5.5 model cards) and
  the Amazon Bedrock pricing page (Global and Geo/In-region cross-Region inference, US East (Ohio)),
  read 2026-11-08. The Haiku 5.5 and GPT-6 Astra long-context rates are as provided by the
  repository owner from the Bedrock pricing page. Sonnet 5.5 and Opus 5.5 carry no long-context
  tier.
  Transcribed by hand; see docs/eval-methodology.md.
sourced_on: "2026-11-08"
sourced_by: "repository owner"

# Per-1M-token rates, global route, standard context unless under `long_context`. cache_write is
# the 5-minute (Anthropic) / 30-minute (GPT-6) rate.
models:
  anthropic.claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_write: 5.00
    cache_read: 0.20
  anthropic.claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_read: 0.10
  anthropic.claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_write: 0.125
    cache_read: 0.01
    long_context:
      above_prompt_tokens: 100000
      input: 0.50
      output: 2.50
      cache_write: 0.625
      cache_read: 0.05
  openai.gpt-6-astra:
    input: 10.00
    output: 50.00
    cache_write: 12.50
    cache_read: 1.00
    long_context:
      above_prompt_tokens: 272000
      input: 20.00
      output: 75.00
      cache_write: 25.00
      cache_read: 2.00
  openai.gpt-6.1-sol:
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_read: 0.10
    long_context:
      above_prompt_tokens: 272000
      input: 4.00
      output: 15.00
      cache_write: 5.00
      cache_read: 0.20
  openai.gpt-6.1-terra:
    input: 1.00
    output: 5.00
    cache_write: 1.25
    cache_read: 0.05
    long_context:
      above_prompt_tokens: 272000
      input: 2.00
      output: 7.50
      cache_write: 2.50
      cache_read: 0.10
  openai.gpt-6-luna:
    input: 0.10
    output: 0.50
    cache_write: 0.125
    cache_read: 0.01
    long_context:
      above_prompt_tokens: 272000
      input: 0.20
      output: 0.75
      cache_write: 0.25
      cache_read: 0.02

# Reasoning and thinking tokens are billed as output tokens and are counted inside output_tokens;
# they are not recorded separately.
reasoning_tokens_billed_as: output

# Per-model prompt-cache minimum checkpoint sizes live in model_capabilities.yaml and are
# reported alongside cost.
