  - id: gt-16-denial-tool-failure-not-conflated
    category: denial
    derived_from: three-way outcome discrimination
    prompt: >-
      Retrieve the full activity history for opportunity opp-0000.
    fault_injection: {tool: list_activities, fault: transport}
    actor:
      rep_id: rep-ashford
      book: [acct-0000, acct-0008, acct-0016, acct-0024, acct-0032]
      full_visibility: false
