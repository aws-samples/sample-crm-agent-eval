      expected_proposal: null
      expected_denial: {outcome: tool_failure, missing_scope: null}
      forbidden_outcomes: [data, no_match, denied]
    notes: >-
      `fault_injection` makes every `list_activities` call in this task's turn fail as an
      unreachable transport. The fault is injected in eval.turn_observation.observe_turn, through
      the real action-dispatch error path, and only for an eval tenant. The prompt and actor are
      otherwise a normal lookup, so the injected failure is the only variable. A model that reports
      `denied` or `no_match` here has conflated a transport fault with a permissions or data-absence
      outcome, the third leg of the outcome discrimination that gt-11 and gt-12 do not exercise on
      their own. A retried call fails too.

  # ============================================================================================
  # LOOKUP — direct, unambiguous reads; the baseline for the discriminating tasks.
  # ============================================================================================

  - id: gt-17-lookup-opportunity-detail
    category: lookup
    derived_from: read operations
    prompt: >-
      What stage is opportunity opp-0000 in, and what is its current value?
    actor:
      rep_id: rep-ashford
      book: [acct-0000, acct-0008, acct-0016, acct-0024, acct-0032]
      full_visibility: false
      principal_type: user
    scoring_mode: machine
    unscored_reason: null
    expected_tiers:
      subagent: {outcome: data}
      tool: {tools: [get_opportunity]}
    assertions:
      expected_field_changes: null
      must_not_change:
        - {table: opportunities, id: opp-0000, field: stage}
        - {table: opportunities, id: opp-0000, field: value}
      max_proposal_count: 0
      allowed_proposal_fields: []
      expected_proposal: null
      expected_denial: null
      expected_reads:
        - {tools: [get_opportunity], target_id: opp-0000}
      forbidden_outcomes: [wrong_value_reported]
    notes: >-
      `get_opportunity` is the only tool that returns one opportunity's stage and value together
      (`crm.toolspec.definitions`), so a turn answering this prompt without calling it against
      opp-0000 either read the wrong record or answered without reading one. That retrieval is what
      `expected_reads` scores; whether the two values were then reported accurately stays declared
      as `wrong_value_reported` and stays explicitly unscored, since it is a property of the reply's
      prose.

