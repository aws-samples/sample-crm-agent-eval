<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1162px" height="772px" viewBox="0 0 1162 772"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="figure-title"><g><rect x="0" y="0" width="1160" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="22px" style="fill: rgb(35, 47, 62);"><text x="580" y="26">CRM Agent Eval — relay build flow and deploy guard</text></g></g></g><g data-cell-id="builddir"><g transform="translate(0.5,0.5)"><rect x="700" y="64" width="460" height="268" rx="8.04" ry="8.04" fill="none" stroke="#879196" stroke-dasharray="3 3" pointer-events="all" style="stroke: rgb(135, 145, 150);"/></g><g><g fill="#545B64" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: rgb(84, 91, 100);"><text x="712" y="87">infra/build/lambda/ (gitignored, read by Terraform)</text></g></g></g><g data-cell-id="src"><g transform="translate(0.5,0.5)"><rect x="0" y="201" width="200" height="90" rx="7.2" ry="7.2" fill="#f2f3f3" stroke="#879196" pointer-events="all" style="fill: rgb(242, 243, 243); stroke: rgb(135, 145, 150);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="100" y="227.5">src/relay/</text><text x="100" y="243.5">TypeScript sources,</text><text x="100" y="259.5">package.json, lockfile,</text><text x="100" y="275.5">tsconfig files</text></g></g></g><g data-cell-id="plambdas"><g transform="translate(0.5,0.5)"><rect x="280" y="90" width="330" height="64" rx="5.12" ry="5.12" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="445" y="111.5">scripts/package_lambdas.sh</text><text x="445" y="127.5">Python zips; clears the build</text><text x="445" y="143.5">directory but keeps relay.zip</text></g></g></g><g data-cell-id="prelay"><g transform="translate(0.5,0.5)"><rect x="280" y="170" width="330" height="152" rx="9.12" ry="9.12" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="294" y="203.5">scripts/package_relay.sh</text><text x="294" y="219.5">1. npm ci, then tsc -p tsconfig.build.json</text><text x="294" y="235.5">2. stage the output, index.js at the root</text><text x="294" y="251.5">3. npm ci --omit=dev (production deps)</text><text x="294" y="267.5">4. write .relay-build.json (input SHA-256s)</text><text x="294" y="283.5">5. zip -X, sorted entries, fixed mtimes</text><text x="294" y="299.5">6. import probe on the built zip</text></g></g></g><g data-cell-id="pyzips"><g transform="translate(0.5,0.5)"><rect x="720" y="102" width="420" height="40" rx="3.2" ry="3.2" fill="#ffffff" stroke="#879196" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(135, 145, 150);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="930" y="127.5">Python Lambda zips</text></g></g></g><g data-cell-id="zip"><g transform="translate(0.5,0.5)"><rect x="720" y="174" width="420" height="140" rx="8.4" ry="8.4" fill="#e8f5e1" stroke="#3f8624" pointer-events="all" style="fill: rgb(232, 245, 225); stroke: rgb(63, 134, 36);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="930" y="217.5">relay.zip (byte-deterministic)</text><text x="930" y="233.5">index.js at the archive root</text><text x="930" y="249.5">package.json with "type": "module"</text><text x="930" y="265.5">node_modules/ (production only)</text><text x="930" y="281.5">.relay-build.json manifest</text></g></g></g><g data-cell-id="guard"><g transform="translate(0.5,0.5)"><rect x="0" y="394" width="1160" height="290" rx="8.7" ry="8.7" fill="none" stroke="#232f3e" pointer-events="all" style="stroke: rgb(35, 47, 62);"/></g><g><g fill="#232F3E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="12" y="418">scripts/deploy.sh guard, before terraform init</text></g></g></g><g data-cell-id="pycheck"><g transform="translate(0.5,0.5)"><rect x="20" y="444" width="220" height="80" rx="6.4" ry="6.4" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="130" y="473.5">check_lambda_zip_imports.py</text><text x="130" y="489.5">--require-zips</text><text x="130" y="505.5">(the Python zips)</text></g></g></g><g data-cell-id="c1"><g transform="translate(0.5,0.5)"><rect x="300" y="436" width="270" height="96" rx="7.68" ry="7.68" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="435" y="465.5">1. check_relay_zip.py</text><text x="435" y="481.5">--require-zip --zip relay.zip</text><text x="435" y="497.5">manifest vs current SHA-256</text><text x="435" y="513.5">of src/relay (currency)</text></g></g></g><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="630" y="436" width="250" height="96" rx="7.68" ry="7.68" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="755" y="465.5">2. package_relay.sh</text><text x="755" y="481.5">--verify-only relay.zip</text><text x="755" y="497.5">import index.handler from</text><text x="755" y="513.5">the zip (importability)</text></g></g></g><g data-cell-id="tf"><g transform="translate(0.5,0.5)"><rect x="940" y="444" width="200" height="80" rx="6.4" ry="6.4" fill="#e8f5e1" stroke="#3f8624" pointer-events="all" style="fill: rgb(232, 245, 225); stroke: rgb(63, 134, 36);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="1040" y="481.5">terraform init,</text><text x="1040" y="497.5">then apply</text></g></g></g><g data-cell-id="pyfail"><g transform="translate(0.5,0.5)"><rect x="20" y="584" width="220" height="76" rx="6.08" ry="6.08" fill="#fdecea" stroke="#d13212" pointer-events="all" style="fill: rgb(253, 236, 234); stroke: rgb(209, 50, 18);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="130" y="611.5">die: Python zips stale</text><text x="130" y="627.5">or missing</text><text x="130" y="643.5">nothing applied</text></g></g></g><g data-cell-id="c1fail"><g transform="translate(0.5,0.5)"><rect x="300" y="584" width="270" height="76" rx="6.08" ry="6.08" fill="#fdecea" stroke="#d13212" pointer-events="all" style="fill: rgb(253, 236, 234); stroke: rgb(209, 50, 18);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="435" y="611.5">exit 1: stale, absent, unreadable</text><text x="435" y="627.5">exit 3: verified nothing</text><text x="435" y="643.5">either way: die, nothing applied</text></g></g></g><g data-cell-id="c2fail"><g transform="translate(0.5,0.5)"><rect x="630" y="584" width="250" height="76" rx="6.08" ry="6.08" fill="#fdecea" stroke="#d13212" pointer-events="all" style="fill: rgb(253, 236, 234); stroke: rgb(209, 50, 18);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="755" y="611.5">die: handler cannot be</text><text x="755" y="627.5">imported from the zip</text><text x="755" y="643.5">nothing applied</text></g></g></g><g data-cell-id="note"><g transform="translate(0.5,0.5)"><rect x="0" y="714" width="1160" height="56" rx="3.36" ry="3.36" fill="none" stroke="#879196" stroke-dasharray="3 3" pointer-events="all" style="stroke: rgb(135, 145, 150);"/></g><g><g fill="#545B64" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(84, 91, 100);"><text x="14" y="739.5">Neither guard rebuilds: run scripts/package_relay.sh, then deploy again.</text><text x="14" y="755.5">make verify runs check_relay_zip.py without --require-zip: no zip is [SKIP] (exit 3), never a pass.</text></g></g></g><g data-cell-id="e_src_prelay"><g><path d="M 200 246 L 270.82 246" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 278.32 246 L 270.82 249.75 L 270.82 242.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><rect fill="#FFFFFF" stroke="none" x="222" y="239" width="37" height="17" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="240" y="251.5">inputs</text></g></g></g><g data-cell-id="e_prelay_zip"><g><path d="M 610 246 L 665 246 L 665 244 L 710.82 244" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 718.32 244 L 710.82 247.75 L 710.82 240.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterl