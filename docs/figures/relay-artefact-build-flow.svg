: rgb(35, 47, 62);"/><path d="M 462 434.32 L 458.25 426.82 L 465.75 426.82 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><rect fill="#FFFFFF" stroke="none" x="550" y="342" width="51" height="17" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="575" y="354.5">manifest</text></g></g></g><g data-cell-id="e_zip_c2"><g><path d="M 846 314 L 846 426.82" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 846 434.32 L 842.25 426.82 L 849.75 426.82 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><rect fill="#FFFFFF" stroke="none" x="805" y="347" width="84" height="17" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="846" y="359.5">extract, import</text></g></g></g><g data-cell-id="e_py_c1"><g><path d="M 240 484 L 290.82 484" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 298.32 484 L 290.82 487.75 L 290.82 480.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><rect fill="#FFFFFF" stroke="none" x="256" y="477" width="29" height="17" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="270" y="489.5">pass</text></g></g></g><g data-cell-id="e_c1_c2"><g><path d="M 570 484 L 620.82 484" fill="none" stroke=