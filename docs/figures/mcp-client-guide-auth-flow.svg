ont-size="13px" style="fill: rgb(35, 47, 62);"><text x="150" y="242.5">Authorization code + PKCE (S256)</text><text x="150" y="258.5">mcp_oauth app client (user)</text><text x="150" y="274.5">supervisor/chat → Gateway #2 only</text><text x="150" y="290.5">Gateway #1 refuses it: client not</text><text x="150" y="306.5">allowed, no gateway/invoke scope</text></g></g></g><g data-cell-id="s1"><g transform="translate(0.5,0.5)"><rect x="390" y="84" width="340" height="70" rx="10.5" ry="10.5" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="560" y="108.5">AgentCore Gateway – CUSTOM_JWT authorizer</text><text x="560" y="124.5">allowed_clients, allowed_scopes</text><text x="560" y="140.5">(custom-claim rules: none configured)</text></g></g></g><g data-cell-id="s2"><g transform="translate(0.5,0.5)"><rect x="390" y="204" width="340" height="84" rx="12.6" ry="12.6" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="560" y="227.5">REQUEST interceptor – 1. re-verify the JWT</text><text x="560" y="243.5">against Cognito JWKS: signature, exp, iss,</text><text x="560" y="259.5">token_use, client id in the allowed list,</text><text x="560" y="275.5">this Gateway's scope</text></g></g></g><g data-cell-id="s3"><g transform="translate(0.5,0.5)"><rect x="390" y="338" width="340" height="84" rx="12.6" ry="12.6" fill="#e8f5e1" stroke="#3f8624" pointer-events="all" style="fill: rgb(232, 245, 225); stroke: rgb(63, 134, 36);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="560" y="361.5">REQUEST interceptor – 2. rewrite arguments</text><