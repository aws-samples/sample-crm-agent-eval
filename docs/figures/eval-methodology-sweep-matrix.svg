ll="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="22px" style="fill: rgb(35, 47, 62);"><text x="865" y="154">=</text></g></g></g><g data-cell-id="f_runs"><g><rect x="880" y="109" width="160" height="70" rx="10.5" ry="10.5" fill="#ffffff" stroke="#147eba" stroke-width="2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(35, 47, 62);"><text x="960" y="141.5">48 agent runs</text><text x="960" y="159.5">per repeat</text></g></g></g><g data-cell-id="p_seed"><g transform="translate(0.5,0.5)"><rect x="0" y="279" width="200" height="70" rx="10.5" ry="10.5" fill="#ffffff" stroke="#232f3e" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(35, 47, 62);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="100" y="303.5">run_sweep</text><text x="100" y="319.5">allocate run_id, seed one</text><text x="100" y="335.5">tenant per arm × repeat</text></g></g></g><g data-cell-id="p_runs"><g transform="translate(0.5,0.5)"><rect x="260" y="279" width="230" height="70" rx="10.5" ry="10.5" fill="#ffffff" stroke="#232f3e" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(35, 47, 62);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="375" y="303.5">per run: one agent turn,</text><text x="375" y="319.5">score_task on committed state</text><text x="375" y="335.5">and proposals (no judge model)</text></g></g></g><g data-cell-id="p_matrix"><g transform="translate(0.5,0.5)"><rect x="590" y="279" width="170" height="70" rx="10.5" ry="10.5" fill="#ffffff" stroke="#232f3e" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(35, 47, 62);"/></g><g><g fill=