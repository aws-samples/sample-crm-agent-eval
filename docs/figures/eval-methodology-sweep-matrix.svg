 font-size="13px" style="fill: rgb(35, 47, 62);"><text x="2" y="538">Measurement only: each arm's figures are reported side by side, with no winner, verdict or recommendation.</text><text x="2" y="554">--assert-artifacts fails a sweep whose artifacts render a verdict. The stub provider is the default; --live reaches the models.</text></g></g></g><g data-cell-id="e_runs_seed"><g><path d="M 960 179 L 960 229 L 100 229 L 100 269.82" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 100 277.32 L 96.25 269.82 L 103.75 269.82 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><rect fill="#FFFFFF" stroke="none" x="504" y="222" width="54" height="17" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="530" y="234.5">executes</text></g></g></g><g data-cell-id="e_seed_runs"><g><path d="M 200 314 L 250.82 314" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 258.32 314 L 250.82 317.75 L 250.82 310.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><rect fill="#FFFFFF" stroke="none" x="208" y="307" width="45" height="17" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="230" y="319.5">seeded</text></g></g></g><g data-cell-id="e_runs_matrix"><g><path d="M 490 314 L 580.82 314" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 588.32 314 L 580.82 317.75 L 