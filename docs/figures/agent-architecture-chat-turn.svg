/g></g><g data-cell-id="sup"><g transform="translate(0.5,0.5)"><rect x="630" y="64" width="180" height="56" rx="4.48" ry="4.48" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="720" y="98">Runtime – supervisor</text></g></g></g><g data-cell-id="sub"><g transform="translate(0.5,0.5)"><rect x="840" y="64" width="180" height="56" rx="4.48" ry="4.48" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="930" y="89.5">Runtime – subagent</text><text x="930" y="106.5">and tool tier</text></g></g></g><g data-cell-id="model"><g transform="translate(0.5,0.5)"><rect x="1050" y="64" width="180" height="56" rx="4.48" ry="4.48" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="1140" y="98">Amazon Bedrock</text></g></g></g><g data-cell-id="act"><g transform="translate(0.5,0.5)"><rect x="1260" y="64" width="180" height="56" rx="4.48" ry="4.48" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="1350" y="98">CRM action Lambda</text></g></g></g><g data-cell-id="c1"><g><path d="M 90 192 L 290.82 192" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 298.32 192 L 290.82 195.75 L 290.82 188.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c2"><g><rect x="98" y="150" width="470" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="100" y="165.5">1. POST /agent/* with the Cognito token</text><text x="100" y="181.5">in X-Crm-Authorization</text></g></g></g><g data-cell-id="c3"><g><path d="M 300 238 L 500.82 238" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 508.32 238 L 500.82 241.75 L 500.82 234.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c4"><g><rect x="308" y="214" width="470" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="310" y="228.5">2. OAC signs the request (SigV4)</text></g></g></g><g data-cell-id="c5"><g><rect x="520" y="260" width="420" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="522" y="274.5">3. verify the token: issuer, keys, audience</text></g></g></g><g data-cell-id="c6"><g><path d="M 510 342 L 710.82 342" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 718.32 342 L 710.82 345.75 L 710.82 338.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c7"><g><rect x="518" y="300" width="470" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="520" y="315.5">4. InvokeAgentRuntime (SigV4);</text><text x="520" y="331.5">verified claims as _agent_identity</text></g></g></g><g data-cell-id="c8"><g><rect x="730" y="364" width="420" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="732" y="378.5">5. decode_identity, resolve tuning, drive_turn</text></g></g></g><g data-cell-id="c9"><g><path d="M 720 428 L 1130.82 428" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 1138.32 428 L 1130.82 431.75 L 1130.82 424.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c10"><g><rect x="728" y="404" width="680" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="730" y="418.5">6. supervisor-tier model call</text></g></g></g><g data-cell-id="c11"><g><path d="M 720 474 L 1340.82 474" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 1348.32 474 L 1340.82 477.75 L 1340.82 470.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c12"><g><rect x="728" y="450" width="890" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="730" y="464.5">7. direct read tool: lambda:InvokeFunction</text></g></g></g><g data-cell-id="c13"><g><path d="M 720 520 L 920.82 520" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 928.32 520 L 920.82 523.75 L 920.82 516.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c14"><g><rect x="728" y="496" width="470" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="730" y="510.5">8. delegate: subagent tool with an intent</text></g></g></g><g data-cell-id="c15"><g><path d="M 930 566 L 1130.82 566" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 1138.32 566 L 1130.82 569.75 L 1130.82 562.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c16"><g><rect x="938" y="542" width="470" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="940" y="556.5">9. subagent-tier and tool-tier model calls</text></g></g></g><g data-cell-id="c17"><g><path d="M 930 612 L 1340.82 612" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 1348.32 612 L 1340.82 615.75 L 1340.82 608.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c18"><g><rect x="938" y="588" width="680" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="940" y="602.5">10. leaf tool: lambda:InvokeFunction (agent channel)</text></g></g></g><g data-cell-id="c19"><g><path d="M 1350 658 L 939.18 658" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 931.68 658 L 939.18 654.25 L 939.18 661.75 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c20"><g><rect x="938" y="634" width="680" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="940" y="648.5">11. handler result, verbatim</text></g></g></g><g data-cell-id="c21"><g><path d="M 930 704 L 729.18 704" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 721.68 704 L 729.18 700.25 L 729.18 707.75 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c22"><g><rect x="728" y="680" width="470" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="730" y="694.5">12. one outcome: data, denied, tool_failure or no_match</text></g></g></g><g data-cell-id="c23"><g><path d="M 720 786 L 519.18 786" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 511.68 786 L 519.18 782.25 L 519.18 789.75 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c24"><g><rect x="518" y="726" width="470" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="520" y="742.5">13. SSE frames, streamed as the turn runs: tool_call,</text><text x="520" y="758.5">tool_result, proposal, text_delta, usage, heartbeat,</text><text x="520" y="774.5">completed or error</text></g></g></g><g data-cell-id="c25"><g><path d="M 510 832 L 99.18 832" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 91.68 832 L 99.18 828.25 L 99.18 835.75 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="c26"><g><rect x="98" y="808" width="680" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="100" y="822.5">14. frames re-emitted verbatim, back through CloudFront</text></g></g></g><g data-cell-id="c27"><g transform="translate(0.5,0.5)"><path d="M 90 120 L 90 864" fill="none" stroke="#879196" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: rgb(135, 145, 150);"/></g></g><g data-cell-id="c28"><g transform="translate(0.5,0.5)"><path d="M 300 120 L 300 864" fill="none" stroke="#879196" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: rgb(135, 145, 150);"/></g></g><g data-cell-id="c29"><g transform="translate(0.5,0.5)"><path 