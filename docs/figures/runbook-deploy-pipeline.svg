<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="912px" height="716px" viewBox="0 0 912 716"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="figure-title"><g><rect x="0" y="0" width="910" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#232F3E" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="22px" style="fill: rgb(35, 47, 62);"><text x="455" y="26">CRM Agent Eval — the deploy pipeline</text></g></g></g><g data-cell-id="build"><g transform="translate(0.5,0.5)"><rect x="0" y="64" width="270" height="110" rx="6.6" ry="6.6" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="135" y="91">1. Build</text><text x="135" y="108">scripts/package_lambdas.sh</text><text x="135" y="125">scripts/package_relay.sh</text><text x="135" y="142">(either order)</text><text x="135" y="159">→ infra/build/lambda/</text></g></g></g><g data-cell-id="backend"><g transform="translate(0.5,0.5)"><rect x="320" y="64" width="270" height="110" rx="6.6" ry="6.6" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="455" y="99.5">2. State backend</text><text x="455" y="116.5">(one time per account)</text><text x="455" y="133.5">infra/bootstrap_state_backend.sh</text><text x="455" y="150.5">→ infra/backend.hcl</text></g></g></g><g data-cell-id="tfvars"><g transform="translate(0.5,0.5)"><rect x="640" y="64" width="270" height="110" rx="6.6" ry="6.6" fill="#e6f2f8" stroke="#147eba" pointer-events="all" style="fill: rgb(230, 242, 248); stroke: rgb(20, 126, 186);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="775" y="99.5">3. infra/terraform.tfvars</text><text x="775" y="116.5">adopted VPC, subnet and</text><text x="775" y="133.5">route-table ids;</text><text x="775" y="150.5">adopted-VPC preflight</text></g></g></g><g data-cell-id="deploy"><g transform="translate(0.5,0.5)"><rect x="0" y="254" width="270" height="240" rx="14.4" ry="14.4" fill="#fff4e5" stroke="#ed7100" pointer-events="all" style="fill: rgb(255, 244, 229); stroke: rgb(237, 113, 0);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="135" y="303.5">4. scripts/deploy.sh</text><text x="135" y="320.5">refusals and gates (exposure,</text><text x="135" y="337.5">VPC preflight, zip checks)</text><text x="135" y="354.5">terraform apply</text><text x="135" y="371.5">parity and drift checks</text><text x="135" y="388.5">publish the SPA:</text><text x="135" y="405.5">npm run build → frontend/dist</text><text x="135" y="422.5">s3 sync to the origin bucket</text><text x="135" y="439.5">CloudFront invalidation /*</text><text x="135" y="456.5">→ results/tf-outputs.json</text></g></g></g><g data-cell-id="first"><g transform="translate(0.5,0.5)"><rect x="320" y="254" width="270" height="240" rx="14.4" ry="14.4" fill="#ffffff" stroke="#ed7100" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(237, 113, 0);"/></g><g><g fill="#232F3E" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="455" y="276">5. First deployment: two applies</text></g></g><g data-cell-id="a1"><g transform="translate(0.5,0.5)"><rect x="335" y="294" width="240" height="52" rx="3.12" ry="3.12" fill="#fff4e5" stroke="#ed7100" pointer-events="all" style="fill: rgb(255, 244, 229); stroke: rgb(237, 113, 0);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="455" y="317.5">Apply 1: deploy.sh with a</text><text x="455" y="333.5">placeholder security group</text></g></g></g><g data-cell-id="sg"><g transform="translate(0.5,0.5)"><rect x="335" y="362" width="240" height="52" rx="3.12" ry="3.12" fill="#fff4e5" stroke="#ed7100" pointer-events="all" style="fill: rgb(255, 244, 229); stroke: rgb(237, 113, 0);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="455" y="385.5">read the id of</text><text x="455" y="401.5">CloudFront-VPCOrigins-Service-SG</text></g></g></g><g data-cell-id="a2"><g transform="translate(0.5,0.5)"><rect x="335" y="430" width="240" height="52" rx="3.12" ry="3.12" fill="#fff4e5" stroke="#ed7100" pointer-events="all" style="fill: rgb(255, 244, 229); stroke: rgb(237, 113, 0);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: rgb(35, 47, 62);"><text x="455" y="453.5">Apply 2: deploy.sh with that</text><text x="455" y="469.5">id; /api/* now reachable</text></g></g></g><g data-cell-id="a1-sg"><g><path d="M 455 346 L 455 356 L 455 352 L 455 352.82" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 455 360.32 L 451.25 352.82 L 458.75 352.82 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="sg-a2"><g><path d="M 455 414 L 455 424 L 455 420 L 455 420.82" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 455 428.32 L 451.25 420.82 L 458.75 420.82 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" s