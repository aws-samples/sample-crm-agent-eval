 50, 18);"/></g><g><g fill="#232F3E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(35, 47, 62);"><text x="775" y="589">9. Teardown</text><text x="775" y="606">reap_eval_tenants.py first</text><text x="775" y="623">scripts/teardown.sh</text><text x="775" y="640">(≤5 min ENI wait; re-run if held)</text><text x="775" y="657">scan_residue.py</text><text x="775" y="674">remove_state_backend.py</text><text x="775" y="691">scan_residue.py → exit 0</text></g></g></g><g data-cell-id="e12"><g><path d="M 270 119 L 310.82 119" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 318.32 119 L 310.82 122.75 L 310.82 115.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="e23"><g><path d="M 590 119 L 630.82 119" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 638.32 119 L 630.82 122.75 L 630.82 115.25 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="e34"><g><path d="M 775 174 L 775 204 L 135 204 L 135 244.82" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 135 252.32 L 131.25 244.82 L 138.75 244.82 Z" fill="#232f3e" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 47, 62); stroke: rgb(35, 47, 62);"/></g></g><g data-cell-id="e45"><g><path d="M 270 374 L 310.82 374" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 47, 62);"/><path d="M 318.32 374 L 310.82 377.75 L 310.82 370.25 Z" fill="#232f3e" stroke="#232f